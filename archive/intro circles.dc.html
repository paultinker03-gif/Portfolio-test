<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  html, body { margin:0; padding:0; height:100%; background:#134A41; }
  a { color:#F8C777; } a:hover { color:#FFE0A6; }
</style>
</helmet>
<div style="position:relative; width:100%; height:100vh; min-height:420px; background:#134A41; overflow:hidden">
  <div ref="{{ mountRef }}" style="position:absolute; inset:0"></div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;bgColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#134A41&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#134A41&quot;,&quot;#0E1B2A&quot;,&quot;#1A1A1A&quot;,&quot;#F3EDE3&quot;]},&quot;followCursor&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;speed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.2,&quot;max&quot;:2.5,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;},&quot;merge&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.14,&quot;min&quot;:0,&quot;max&quot;:0.4,&quot;step&quot;:0.01,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Blending&quot;}}">
const THREE_URL = "https://esm.sh/three@0.160.0";

const FRAG = `
precision highp float;
uniform vec2 uRes;
uniform float uTanH, uCamZ, uK, uGroundY;
uniform vec3 uPos[4];
uniform mat3 uRotInv[4];
uniform vec2 uSize[4];
uniform vec3 uCol[4];
uniform vec3 uBg;

float sdTorus(vec3 p, vec2 t) {
  vec2 q = vec2(length(p.xz) - t.x, p.y);
  return length(q) - t.y;
}

vec4 map(vec3 p) {
  float d = 1e9;
  vec3 c = vec3(0.0);
  for (int i = 0; i < 4; i++) {
    vec3 q = uRotInv[i] * (p - uPos[i]);
    float di = sdTorus(q, uSize[i]);
    if (i == 0) { d = di; c = uCol[i]; }
    else {
      float h = clamp(0.5 + 0.5 * (di - d) / uK, 0.0, 1.0);
      d = mix(di, d, h) - uK * h * (1.0 - h);
      c = mix(uCol[i], c, h);
    }
  }
  return vec4(c, d);
}

float softshadow(vec3 ro, vec3 rd) {
  float res = 1.0;
  float t = 0.03;
  for (int i = 0; i < 40; i++) {
    float h = map(ro + rd * t).w;
    res = min(res, 7.0 * h / t);
    t += clamp(h, 0.03, 0.5);
    if (h < 0.001 || t > 9.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

vec3 nrm(vec3 p) {
  vec2 e = vec2(0.0015, 0.0);
  return normalize(vec3(
    map(p + e.xyy).w - map(p - e.xyy).w,
    map(p + e.yxy).w - map(p - e.yxy).w,
    map(p + e.yyx).w - map(p - e.yyx).w));
}

void main() {
  vec2 uv = (gl_FragCoord.xy / uRes) * 2.0 - 1.0;
  float aspect = uRes.x / uRes.y;
  vec3 ro = vec3(0.0, 0.0, uCamZ);
  vec3 rd = normalize(vec3(uv.x * uTanH * aspect, uv.y * uTanH, -1.0));

  float t = 0.0;
  vec4 hit = vec4(0.0);
  bool got = false;
  for (int i = 0; i < 110; i++) {
    vec3 p = ro + rd * t;
    vec4 m = map(p);
    if (m.w < 0.0012) { hit = m; got = true; break; }
    t += m.w * 0.9;
    if (t > 26.0) break;
  }

  vec3 L = normalize(vec3(0.22, 0.94, 0.42));

  if (!got) {
    vec3 col = uBg;
    float td = (uGroundY - ro.y) / rd.y;
    if (td > 0.0 && td < 60.0) {
      vec3 gp = ro + rd * td;
      float s = softshadow(gp + vec3(0.0, 0.002, 0.0), L);
      float fade = exp(-0.05 * max(0.0, td - 6.0));
      col = mix(uBg, uBg * 0.78, (1.0 - s) * 0.6 * fade);
    }
    gl_FragColor = vec4(col, 1.0);
    return;
  }

  vec3 col;
  {
    vec3 p = ro + rd * t;
    vec3 n = nrm(p);
    vec3 L2 = normalize(vec3(-0.6, -0.3, -0.5));
    vec3 V = -rd;
    float diff = max(dot(n, L), 0.0);
    float fill = max(dot(n, L2), 0.0) * 0.3;
    vec3 hv = normalize(L + V);
    float sh = mix(0.72, 1.0, softshadow(p + n * 0.01, L));
    // flat, matte shading: shallow wrap light, no specular
    float wrap = (diff * 0.5 + 0.5);
    col = hit.rgb * (0.78 + 0.26 * wrap * sh + fill * 0.35);
  }
  gl_FragColor = vec4(pow(max(col, 0.0), vec3(0.4545)), 1.0);
}
`;

class Component extends DCLogic {
  renderVals() {
    return { mountRef: (el) => { this._mount = el; if (el && !this._booted) { this._booted = true; this._boot(el); } } };
  }

  componentWillUnmount() {
    cancelAnimationFrame(this._raf);
    window.removeEventListener("pointermove", this._onMove);
    window.removeEventListener("touchmove", this._onTouch);
    window.removeEventListener("touchstart", this._onTouch);
    window.removeEventListener("pointerleave", this._onLeave);
    window.removeEventListener("resize", this._onResize);
    if (this._renderer) this._renderer.dispose();
  }

  async _boot(el) {
    const THREE = await import(THREE_URL);
    this.THREE = THREE;

    // manage colour spaces by hand: uBg stays sRGB, ring colours go to linear for lighting
    THREE.ColorManagement.enabled = false;
    const hex = (this.props.bgColor || "#134A41").replace("#", "");
    const bg = new THREE.Vector3(
      parseInt(hex.slice(0, 2), 16) / 255,
      parseInt(hex.slice(2, 4), 16) / 255,
      parseInt(hex.slice(4, 6), 16) / 255
    );
    const lin = (v) => Math.pow(v / 255, 2.2);
    const cols = [[248, 168, 142], [248, 165, 200], [128, 219, 186], [179, 170, 227]]
      .map((c) => new THREE.Vector3(lin(c[0]), lin(c[1]), lin(c[2])));

    this._camZ = 7.2;
    this._fov = 38;
    this._tanH = Math.tan((this._fov * Math.PI) / 360);

    this._u = {
      uRes: { value: new THREE.Vector2(1, 1) },
      uTanH: { value: this._tanH },
      uCamZ: { value: this._camZ },
      uK: { value: 0.22 },
      uGroundY: { value: -2.4 },
      uPos: { value: [0, 1, 2, 3].map(() => new THREE.Vector3()) },
      uRotInv: { value: [0, 1, 2, 3].map(() => new THREE.Matrix3()) },
      uSize: { value: [0, 1, 2, 3].map(() => new THREE.Vector2(0.4, 0.08)) },
      uCol: { value: cols },
      uBg: { value: bg }
    };

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    scene.add(new THREE.Mesh(
      new THREE.PlaneGeometry(2, 2),
      new THREE.ShaderMaterial({
        uniforms: this._u,
        vertexShader: "void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }",
        fragmentShader: FRAG
      })
    ));

    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
    el.appendChild(renderer.domElement);
    Object.assign(renderer.domElement.style, { width: "100%", height: "100%", display: "block" });

    this._scene = scene; this._camera = camera; this._renderer = renderer;
    this._e = new THREE.Euler();
    this._m4 = new THREE.Matrix4();

    this._t = 0; this._px = null; this._py = null;
    this._cx = 0; this._cy = 0; this._dx = 0; this._dy = 0; this._seeded = false;

    this._onMove = (e) => { if (e.pointerType === "touch") return; this._px = e.clientX; this._py = e.clientY; };
    this._onTouch = (e) => { const t = e.touches && e.touches[0]; if (t) { this._px = t.clientX; this._py = t.clientY; } };
    this._onLeave = () => { this._px = null; this._py = null; };
    this._onResize = () => this._resize();
    window.addEventListener("pointermove", this._onMove, { passive: true });
    window.addEventListener("touchmove", this._onTouch, { passive: true });
    window.addEventListener("touchstart", this._onTouch, { passive: true });
    window.addEventListener("pointerleave", this._onLeave);
    window.addEventListener("resize", this._onResize);
    this._resize();

    const loop = () => { this._frame(); this._raf = requestAnimationFrame(loop); };
    this._raf = requestAnimationFrame(loop);
  }

  _resize() {
    const el = this._mount, r = this._renderer;
    if (!el || !r) return;
    const rect = el.getBoundingClientRect();
    this._w = rect.width; this._h = rect.height;
    this._top = rect.top; this._left = rect.left;
    r.setSize(rect.width, rect.height, false);
    const dpr = r.getPixelRatio();
    this._u.uRes.value.set(rect.width * dpr, rect.height * dpr);
    const vh = 2 * this._tanH * this._camZ;
    this._viewH = vh;
    this._viewW = vh * (rect.width / Math.max(1, rect.height));
  }

  _toWorld(px, py) {
    return {
      x: ((px - this._left) / this._w - 0.5) * this._viewW,
      y: -((py - this._top) / this._h - 0.5) * this._viewH
    };
  }

  _frame() {
    if (!this._renderer || !this._w) return;
    const THREE = this.THREE;
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    this._t += (reduce ? 0.002 : 0.0125) * (this.props.speed ?? 1);
    const t = this._t;

    const CR = Math.min(this._viewW, this._viewH) * 0.22;
    if (!this._seeded) { this._cx = 0; this._cy = 0; this._seeded = true; }

    const follow = this.props.followCursor !== false;
    let tx = 0, ty = 0;
    if (follow && this._px != null) {
      const p = this._toWorld(this._px, this._py);
      tx = p.x * 0.16; ty = p.y * 0.14;
    }
    tx += Math.sin(t * 0.37) * this._viewW * 0.012;
    ty += Math.cos(t * 0.29) * this._viewH * 0.016;
    this._cx += (tx - this._cx) * 0.045;
    this._cy += (ty - this._cy) * 0.045;

    let ang = 0, pull = 0;
    if (follow && this._px != null) {
      const p = this._toWorld(this._px, this._py);
      const vx = p.x - this._cx, vy = p.y - this._cy;
      ang = Math.atan2(vy, vx);
      pull = Math.min(1, Math.hypot(vx, vy) / (Math.min(this._viewW, this._viewH) * 0.55));
    }
    this._dx += (Math.cos(ang) * pull - this._dx) * 0.06;
    this._dy += (Math.sin(ang) * pull - this._dy) * 0.06;
    const bulge = Math.hypot(this._dx, this._dy);
    const bAng = Math.atan2(this._dy, this._dx);

    const spawn = 1 - Math.pow(1 - Math.min(1, t / 0.6), 3);
    const orbit = CR * (0.48 + 0.14 * bulge) * (1 + 0.12 * Math.sin(t * 0.5)) * spawn;
    this._u.uGroundY.value = -this._viewH * 0.46;

    const local = [];
    let extent = 0;
    for (let i = 0; i < 4; i++) {
      const a0 = t * 0.11 + (i / 4) * Math.PI * 2 - Math.PI / 2;
      const wob = 1 + 0.58 * Math.sin(t * (0.78 + i * 0.29) + i * 2.1);
      const lean = 0.24 * bulge * Math.cos(a0 - bAng);
      const d = orbit * wob * (1 + lean);
      const R = CR * (0.30 + 0.028 * Math.sin(t * (0.9 + i * 0.23) + i)) * spawn;
      const tube = R * 0.12;
      const x = Math.cos(a0) * d;
      const y = Math.sin(a0) * d * 0.9;
      const z = Math.sin(t * (0.43 + i * 0.17) + i * 1.7) * CR * 0.3;
      local.push({ x, y, z, R, tube, i });
      const reach = R + tube;
      const persp = this._camZ / Math.max(0.5, this._camZ - (z + reach));
      extent = Math.max(extent, (Math.hypot(x, y) + reach) * persp);
    }

    const limX = Math.max(0, this._viewW / 2 - extent);
    const limY = Math.max(0, this._viewH / 2 - extent);
    this._cx = Math.max(-limX, Math.min(limX, this._cx));
    this._cy = Math.max(-limY, Math.min(limY, this._cy));

    // base tumble, then pull neighbours' angles together as they close in, so
    // touching rings meet coplanar instead of at odd angles
    const base = local.map((p) => {
      const i = p.i;
      return [
        Math.PI / 2 + 0.55 * Math.sin(t * (0.31 + i * 0.13) + i),
        0.9 * Math.sin(t * (0.24 + i * 0.11) + i * 1.4),
        t * (0.18 + i * 0.05)
      ];
    });
    const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
    const eul = base.map((b) => b.slice());
    for (let a = 0; a < local.length; a++) {
      for (let bIdx = 0; bIdx < local.length; bIdx++) {
        if (a === bIdx) continue;
        const p = local[a], q = local[bIdx];
        const dist = Math.hypot(p.x - q.x, p.y - q.y, p.z - q.z);
        const near = (p.R + q.R) * 1.35;
        const w = Math.max(0, 1 - dist / near);
        if (w <= 0) continue;
        const s = w * w * 0.5;
        for (let k = 0; k < 3; k++) eul[a][k] += wrap(base[bIdx][k] - base[a][k]) * s;
      }
    }

    for (const p of local) {
      const i = p.i;
      this._u.uPos.value[i].set(this._cx + p.x, this._cy + p.y, p.z);
      this._u.uSize.value[i].set(p.R, p.tube);
      this._e.set(eul[i][0], eul[i][1], eul[i][2]);
      this._m4.makeRotationFromEuler(this._e);
      this._u.uRotInv.value[i].setFromMatrix4(this._m4).transpose();
    }
    // merge radius: only bridges when rings are genuinely close
    this._u.uK.value = CR * (this.props.merge ?? 0.14);

    this._renderer.render(this._scene, this._camera);
  }
}

</script>
</body>
</html>
