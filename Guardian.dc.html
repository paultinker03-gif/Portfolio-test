<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  a { color: #E4699A; } a:hover { color: #EF9D44; }
</style>
</helmet>
<div style="position:relative;width:100%;height:100vh;min-height:520px;overflow:hidden">
  <x-import component-from-global-scope="guardian-scene" from="./guardian-scene.js" background="{{ bg }}" parallax="{{ parallax }}" float-speed="{{ floatSpeed }}" style="position:absolute;inset:0;width:100%;height:100%" hint-size="100%,100%"></x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;backgroundColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#D2F0D1&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#D2F0D1&quot;,&quot;#F6EFE4&quot;,&quot;#0E0E0E&quot;,&quot;#FBD9E4&quot;]},&quot;parallaxStrength&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;},&quot;floatSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      bg: this.props.backgroundColor ?? '#D2F0D1',
      parallax: this.props.parallaxStrength ?? 1,
      floatSpeed: this.props.floatSpeed ?? 1
    };
  }
}

</script>
</body>
</html>
